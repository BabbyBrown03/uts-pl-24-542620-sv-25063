server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Routing untuk Vue Router (history mode) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy ke backend Laravel ---
    # Browser berjalan di HOST, jadi browser tidak bisa me-resolve nama service
    # Docker ("backend"). Solusinya: browser memanggil /api pada origin frontend ini,
    # lalu Nginx meneruskannya ke service "backend" di jaringan Docker Compose.
    # Dengan begitu tidak ada IP laptop yang dipakai sebagai alamat antarkontainer.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Aset hasil build bersifat immutable (nama file mengandung hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}