name: CI/CD

# Workflow berjalan pada push ke main/dev/branch fitur dan pada Pull Request.
# Job deploy hanya dijalankan untuk push ke branch main (lihat job "deploy").
on:
  push:
    branches: ['**']
  pull_request:

# Jangan jalankan ulang workflow yang sama untuk commit yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # Job 1: Pengujian backend Laravel
  # ==========================================================
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, pdo_sqlite, pdo_mysql, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependency
        run: composer install --no-interaction --no-progress --prefer-dist

      # .env tidak pernah di-commit, jadi harus dibuat dari .env.example
      # terlebih dahulu; tanpa file .env, `key:generate` akan gagal.
      - name: Siapkan konfigurasi & APP_KEY
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Siapkan database SQLite untuk test
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Menjalankan feature test
        run: php artisan test

  # ==========================================================
  # Job 2: Build frontend Vue.js
  # ==========================================================
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Build aplikasi
        run: npm run build

      - name: Pastikan hasil build ada
        run: test -d dist && ls -la dist

  # ==========================================================
  # Job 3: Deploy ke GitHub Container Registry
  # Hanya untuk push ke branch main, dan hanya setelah dua job di atas lulus.
  # ==========================================================
  deploy:
    name: deploy (GHCR)
    # needs = deploy ditunggu sampai backend-test & frontend-build sukses.
    needs: [backend-test, frontend-build]
    # Guard: HANYA push ke branch main. Push ke dev/branch fitur dan Pull Request
    # TIDAK menjalankan job ini.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Diperlukan untuk login ke ghcr.io.
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          # Kredensial otomatis dari GITHUB_TOKEN bawaan repository.
          # Tidak ada username/password yang disimpan di repository.
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag image berbasis nomor commit, bukan hanya "latest".
      - name: Siapkan nama image & tag
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build & push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.frankenphp
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo }}/frontend:latest
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ringkasan image
        run: |
          echo "### Image berhasil diunggah ke GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- keduanya juga tersedia dengan tag :latest" >> $GITHUB_STEP_SUMMARY

  # ==========================================================
  # Job 4: Smoke test image yang baru di-deploy
  # Hanya push ke main, dan memakai SECRET dari GitHub Secrets
  # (APP_KEY & DB_PASSWORD) - tidak ada kredensial di dalam repository.
  # ==========================================================
  deploy-smoke:
    name: deploy-smoke (docker compose)
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Siapkan .env dari GitHub Secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cp .env.example .env
          {
            echo "APP_KEY=${APP_KEY}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_USERNAME=inventaris"
            echo "DB_DATABASE=inventaris"
          } >> .env
          echo "--- .env berhasil dibuat dari Secrets ---"

      - name: Build & jalankan seluruh sistem
        run: docker compose up -d --build

      - name: Tunggu container siap
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "Frontend siap"; break
            fi
            sleep 5
          done
          docker compose ps

      - name: Uji API login & CRUD
        run: |
          set -e
          API=http://localhost:8080/api
          for i in $(seq 1 30); do
            if curl -fsS -X POST "$API/login" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d '{"email":"admin@inventaris.test","password":"password123"}' \
              -o /tmp/login.json; then break; fi
            sleep 5
          done
          TOKEN=$(jq -r .token /tmp/login.json)
          test "$TOKEN" != "null"
          echo "Login berhasil"

          curl -fsS "$API/barang" -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' \
            | jq '.data | length'

          curl -fsS -X POST "$API/barang" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"kode_barang":"BRG-CI-01","nama_barang":"Barang CI","kategori":"Umum","stok":2,"harga":1000}' \
            | jq '.data.id'

      - name: Tampilkan log container
        if: always()
        run: docker compose logs --tail=50 backend

      - name: Hentikan container
        if: always()
        run: docker compose down