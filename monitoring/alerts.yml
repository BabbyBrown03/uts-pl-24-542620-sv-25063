groups:
  - name: inventaris_alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Backend Laravel tidak merespons"
          description: "Layanan backend (inv-backend) telah mati selama lebih dari 30 detik. Cek apakah container backend masih berjalan dan log-nya."
          first_action: "Periksa container backend dengan perintah: docker compose logs backend"