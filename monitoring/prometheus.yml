global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus sendiri
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend Laravel (FrankenPHP di port 8000 di dalam jaringan Docker)
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']

  # Frontend Nginx (port 80 di dalam jaringan Docker)
  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:80']

  # cAdvisor - metrik container (CPU, memori, jaringan per container)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Node Exporter - metrik host
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']