# Admin Inventaris Barang - Docker Compose
#
# Menjalankan SELURUH sistem dengan satu perintah dari root repository:
#     docker compose up -d --build
#
# Service:
#   mysql    - database MySQL 8 (named volume, data tidak hilang)
#   backend  - Laravel REST API yang dilayani FrankenPHP
#   frontend - hasil build Vue.js disajikan Nginx + proxy /api ke backend

name: admin-inventaris

services:
  mysql:
    image: mysql:8.4
    container_name: inv-mysql
    restart: unless-stopped
    environment:
      # Kredensial dibaca dari file .env di root repository (tidak di-commit).
      MYSQL_DATABASE: ${DB_DATABASE:-inventaris}
      MYSQL_USER: ${DB_USERNAME:-inventaris}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      # Named volume => data tetap ada setelah `docker compose down`.
      - dbdata:/var/lib/mysql
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - inventaris

  backend:
    build:
      # Image dasar eksplisit (dunglas/frankenphp:1-php8.3-bookworm).
      context: ./backend
      dockerfile: Dockerfile.frankenphp
    image: ghcr.io/uts-pl-24-542620-sv-25063/backend:latest
    container_name: inv-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "Admin Inventaris Barang"
      APP_ENV: production
      APP_DEBUG: "false"
      # APP_KEY & kredensial DB berasal dari file .env (tidak di-commit).
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi. Salin .env.example menjadi .env lalu jalankan: php -r "echo base64_encode(random_bytes(32));"}
      APP_URL: ${APP_URL:-http://localhost:8000}

      DB_CONNECTION: mysql
      # Backend terhubung ke database melalui NAMA SERVICE Docker Compose.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-inventaris}
      DB_USERNAME: ${DB_USERNAME:-inventaris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi pada file .env}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      RUN_SEEDER: ${RUN_SEEDER:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - inventaris

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Frontend memanggil /api pada origin-nya sendiri; Nginx meneruskannya
        # ke service "backend". Browser (yang jalan di host) tidak perlu
        # me-resolve nama service internal Docker.
        VITE_API_BASE_URL: /api
        VITE_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inventaris.test}
    image: ghcr.io/uts-pl-24-542620-sv-25063/frontend:latest
    container_name: inv-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventaris

volumes:
  dbdata:
    name: inventaris-dbdata

networks:
  inventaris:
    name: inventaris-network
    driver: bridge