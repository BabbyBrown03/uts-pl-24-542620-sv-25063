# Admin Inventaris Barang - Docker Compose
#
# Menjalankan SELURUH sistem dengan satu perintah dari root repository:
#     docker compose up -d --build
#
# Service aplikasi:
#   mysql    - database MySQL 8 (named volume, data tidak hilang)
#   backend  - Laravel REST API yang dilayani FrankenPHP
#   frontend - hasil build Vue.js disajikan Nginx + proxy /api ke backend
#
# Service monitoring:
#   prometheus   - pengumpul metrik & aturan alarm
#   grafana      - dashboard visualisasi
#   cadvisor     - metrik container (CPU, memori, jaringan)
#   node-exporter - metrik host (Node.js/linux host)

name: admin-inventaris

services:
  mysql:
    image: mysql:8.4
    container_name: inv-mysql
    restart: unless-stopped
    environment:
      # Kredensial dibaca dari file .env di root repository (tidak di-commit).
      MYSQL_DATABASE: ${DB_DATABASE:-inventaris}
      MYSQL_USER: ${DB_USERNAME:-inventaris}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      # Named volume => data tetap ada setelah `docker compose down`.
      - dbdata:/var/lib/mysql
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventaris

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.frankenphp
    image: ghcr.io/uts-pl-24-542620-sv-25063/backend:latest
    container_name: inv-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "Admin Inventaris Barang"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi - salin .env.example menjadi .env lalu isi dari php artisan key:generate --show}
      APP_URL: ${APP_URL:-http://localhost:8000}

      DB_CONNECTION: mysql
      # Backend terhubung ke database melalui NAMA SERVICE Docker Compose.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-inventaris}
      DB_USERNAME: ${DB_USERNAME:-inventaris}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi pada file .env}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      RUN_SEEDER: ${RUN_SEEDER:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventaris

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inventaris.test}
    image: ghcr.io/uts-pl-24-542620-sv-25063/frontend:latest
    container_name: inv-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventaris

  # ============================================================
  # LAYANAN PEMANTAU (Monitoring)
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: inv-prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventaris

  grafana:
    image: grafana/grafana:11.0.0
    container_name: inv-grafana
    restart: unless-stopped
    environment:
      # Ganti password default admin agar tidak biarkan admin/admin.
      - GF_SECURITY_ADMIN_PASSWORD=GantiSaya123!
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventaris

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.0
    container_name: inv-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventaris

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: inv-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventaris

volumes:
  dbdata:
    name: inventaris-dbdata
  prometheus-data:
    name: inventaris-prometheus-data
  grafana-data:
    name: inventaris-grafana-data

networks:
  inventaris:
    name: inventaris-network
    driver: bridge